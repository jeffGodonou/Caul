[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caul"
version = "0.7.0"
description = "A small offline voice assistant for your computer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyttsx3==2.99",
    "sounddevice==0.5.6",
    "numpy==2.5.4",
    "vosk==0.3.45",
    "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
caul = "caul:main"

[tool.setuptools]
py-modules = ["caul"]
