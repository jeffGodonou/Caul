name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Caul and its dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Caul, its dependencies, and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download the Vosk speech model
        run: |
          curl.exe -L -o "$env:TEMP\vosk-model.zip" "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          Expand-Archive "$env:TEMP\vosk-model.zip" models
          Remove-Item "$env:TEMP\vosk-model.zip"

      - name: Build the standalone executable
        run: |
          python -m PyInstaller --noconfirm --name caul `
            --add-data "models/vosk-model-small-en-us-0.15;models/vosk-model-small-en-us-0.15" `
            --collect-all vosk --collect-all sounddevice --collect-all pyttsx3 --collect-all comtypes `
            caul.py

      - name: Zip the build
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "dist\caul" -DestinationPath "dist\caul-$version-windows-x64.zip"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/caul-*-windows-x64.zip
          generate_release_notes: true
